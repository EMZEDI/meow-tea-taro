[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meow-tea-taro"
version = "0.1.0"
description = "Meow Tea Taro: A Multi-turn Agentic Reinforcement Learning Framework"
authors = [
    {name = "Ruiyi Wang", email = "ruiyiwang@ucsd.edu"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch==2.6.0",
    "vllm==0.8.4",
    "flashinfer-python==0.2.2",
    "transformers>=4.54.0",
    "accelerate>=0.30.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
    "ray[data,train,tune,serve]>=2.10.0",
    "tensordict==0.6.2",
    "wandb>=0.16.0",
    "tensorboard>=2.16.0",
    "textworld",
    "alfworld",
    "swe-rex",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "torchdata>=0.11.0",
    "codetiming>=1.4.0",
    "trl>=0.24.0",
    "flashinfer-cubin>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
    "ipython>=8.0",
    "jupyterlab>=4.2.0",
    "pre-commit>=3.0",
    "flashinfer-python @ https://github.com/flashinfer-ai/flashinfer/releases/download/v0.2.5/flashinfer_python-0.2.5+cu124torch2.6-cp38-abi3-linux_x86_64.whl",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.3.18/flash_attn-2.7.4+cu124torch2.6-cp310-cp310-linux_x86_64.whl"
]

[project.urls]
Homepage = "https://github.com/ruiyiw/meow-tea-taro"
Repository = "https://github.com/ruiyiw/meow-tea-taro"
Issues = "https://github.com/ruiyiw/meow-tea-taro/issues"

[project.scripts]
meow-tea-train = "meow_tea_train.cli:train_command"

[tool.setuptools]
packages = ["meow_tea_train", "meow_tea_train.verl", "verl", "meow_tea_experiments"]

[tool.setuptools.package-dir]
"meow_tea_train" = "meow_tea_train"
"meow_tea_train.verl" = "meow_tea_train/verl"
"verl" = "meow_tea_train/verl"
"meow_tea_experiments" = "meow_tea_experiments"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120
